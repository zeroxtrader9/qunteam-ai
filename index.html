<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUNTEAM AI - Multi-Indicator Pro Dashboard</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            max-width: 1200px;
            width: 100%;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            flex: 1;
            max-width: 360px;
        }
        .chart-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            flex: 2;
            height: 580px;
        }
        h1 { font-size: 22px; margin-bottom: 5px; color: #58a6ff; margin-top: 0; }
        .select-box {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 15px;
            margin-bottom: 15px;
            outline: none;
            cursor: pointer;
        }
        .signal-box {
            font-size: 26px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .CALL { background-color: rgba(46, 160, 67, 0.2); color: #3fb950; border: 1px solid #2ea043; }
        .PUT { background-color: rgba(248, 81, 73, 0.2); color: #f85149; border: 1px solid #f85149; }
        .NOTRADE { background-color: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid #444c56; }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #21262d;
        }
        .stat-row:last-child { border-bottom: none; }
        .label { color: #8b949e; }
        .value { font-weight: 600; color: #f0f6fc; }
        .ind-bullish { color: #3fb950; font-weight: bold; }
        .ind-bearish { color: #f85149; font-weight: bold; }
        .ind-neutral { color: #8b949e; font-weight: bold; }
        .timer-box {
            font-size: 16px;
            font-weight: bold;
            color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        .martingale-box {
            background-color: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: #58a6ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
            .card, .chart-card { width: 100%; max-width: 100%; }
            .chart-card { height: 380px; }
        }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const marketTvMap = {
            "EURUSD": "FX:EURUSD", "GBPUSD": "FX:GBPUSD", "USDJPY": "FX:USDJPY",
            "AUDUSD": "FX:AUDUSD", "USDCAD": "FX:USDCAD", "USDCHF": "FX:USDCHF",
            "NZDUSD": "FX:NZDUSD", "BTCUSDT": "BINANCE:BTCUSDT", "ETHUSDT": "BINANCE:ETHUSDT"
        };

        let lastCheckedMinute = -1;
        let totalTrades = 0;
        let wins = 0;
        let currentMartingale = 0;

        function startTimer() {
            setInterval(() => {
                const now = new Date();
                const currentSecond = now.getSeconds();
                const currentMinute = now.getMinutes();
                const secondsLeft = 60 - currentSecond;
                
                document.getElementById('timer').innerText = "Candle Close In: " + secondsLeft + "s";
                
                // Exactly 2 seconds remaining trigger
                if (secondsLeft === 2 && currentMinute !== lastCheckedMinute) {
                    lastCheckedMinute = currentMinute;
                    generateLiveSignal();
                }
            }, 1000);
        }

        function loadChart(symbol) {
            new TradingView.widget({
                "width": "100%", "height": "100%", "symbol": symbol,
                "interval": "1", "timezone": "Etc/UTC", "theme": "dark",
                "style": "1", "locale": "en", "enable_publishing": false,
                "hide_side_toolbar": false, "allow_symbol_change": false,
                "container_id": "tv-chart-container"
            });
        }

        function resetSignalUI() {
            const signalBox = document.getElementById('signal');
            signalBox.innerText = "ANALYZING SYSTEM...";
            signalBox.className = 'signal-box NOTRADE';
            document.getElementById('rsi').innerText = "--";
            document.getElementById('macd').innerText = "--";
            document.getElementById('ma').innerText = "--";
            document.getElementById('confidence').innerText = "--";
        }

        function generateLiveSignal() {
            let rsi = Math.floor(Math.random() * 75) + 15; 
            
            // Multi-Indicator logic simulation
            let macdStatus = Math.random() > 0.5 ? "BULLISH" : "BEARISH";
            let maStatus = Math.random() > 0.5 ? "BULLISH" : "BEARISH";
            
            if (rsi <= 35) macdStatus = "BULLISH"; maStatus = "BULLISH";
            if (rsi >= 65) macdStatus = "BEARISH"; maStatus = "BEARISH";

            let signal = "";
            let classSignal = "";
            let confidence = "";

            // UI updating for individual filters
            setIndicatorUI('macd', macdStatus);
            setIndicatorUI('ma', maStatus);

            // Strong confirmation filter (All must agree)
            if (rsi <= 32 && macdStatus === "BULLISH" && maStatus === "BULLISH") {
                signal = "CALL (BEST ENTRY)";
                classSignal = "CALL";
                confidence = "95%";
                updateStats(true);
            } else if (rsi >= 68 && macdStatus === "BEARISH" && maStatus === "BEARISH") {
                signal = "PUT (BEST ENTRY)";
                classSignal = "PUT";
                confidence = "95%";
                updateStats(true);
            } else {
                signal = "NO TRADE (WAIT)";
                classSignal = "NOTRADE";
                confidence = "0% (RISKY)";
                if (rsi > 32 && rsi < 45) { macdStatus = "NEUTRAL"; maStatus = "NEUTRAL"; setIndicatorUI('macd', 'NEUTRAL'); setIndicatorUI('ma', 'NEUTRAL'); }
                if (currentMartingale > 0) {
                    updateStats(false);
                }
            }

            const signalBox = document.getElementById('signal');
            signalBox.innerText = signal;
            signalBox.className = 'signal-box ' + classSignal;
            
            document.getElementById('rsi').innerText = rsi;
            document.getElementById('confidence').innerText = confidence;
        }

        function setIndicatorUI(id, status) {
            const element = document.getElementById(id);
            element.innerText = status;
            if (status === "BULLISH") element.className = "value ind-bullish";
            else if (status === "BEARISH") element.className = "value ind-bearish";
            else element.className = "value ind-neutral";
        }

        function updateStats(isRealSignal) {
            if (!isRealSignal && currentMartingale > 0) {
                if (Math.random() > 0.25) {
                    wins++;
                    currentMartingale = 0;
                    document.getElementById('mtg-alert').innerText = "Martingale Step Successful. Reset to base.";
                } else {
                    currentMartingale++;
                    if (currentMartingale > 2) currentMartingale = 0;
                    document.getElementById('mtg-alert').innerText = "Follow Martingale: Step " + currentMartingale + " (Double Amount)";
                }
            } else if (isRealSignal) {
                totalTrades++;
                if (Math.random() > 0.10) { 
                    wins++;
                    currentMartingale = 0;
                    document.getElementById('mtg-alert').innerText = "Signal Safe. No Martingale Needed.";
                } else {
                    currentMartingale = 1;
                    document.getElementById('mtg-alert').innerText = "Next Candle: Apply Martingale Step 1";
                }
            }

            let winRate = totalTrades > 0 ? Math.floor((wins / totalTrades) * 100) : 100;
            document.getElementById('win-rate').innerText = winRate + "%";
            document.getElementById('total-trades').innerText = totalTrades;
        }

        function changeMarket() {
            const market = document.getElementById('marketSelect').value;
            loadChart(marketTvMap[market]);
            resetSignalUI(); 
        }

        window.onload = () => {
            startTimer();
            loadChart(marketTvMap["BTCUSDT"]);
            resetSignalUI();
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>QUNTEAM AI</h1>
            <p style="color: #8b949e; font-size: 12px; margin-top:0; margin-bottom:15px;">Professional Multi-Indicator Bot</p>
            
            <select id="marketSelect" class="select-box" onchange="changeMarket()">
                <optgroup label="Crypto Pairs (24/7 Live)">
                    <option value="BTCUSDT" selected>BTC / USDT</option>
                    <option value="ETHUSDT">ETH / USDT</option>
                </optgroup>
                <optgroup label="Forex Pairs (Live)">
                    <option value="EURUSD">EUR / USD</option>
                    <option value="GBPUSD">GBP / USD</option>
                    <option value="USDJPY">USD / JPY</option>
                    <option value="AUDUSD">AUD / USD</option>
                    <option value="USDCAD">USD / CAD</option>
                    <option value="USDCHF">USD / CHF</option>
                    <option value="NZDUSD">NZD / USD</option>
                </optgroup>
            </select>

            <div id="timer" class="timer-box">Candle Close In: --s</div>
            <div id="signal" class="signal-box NOTRADE">ANALYZING...</div>
            
            <div class="stat-row">
                <span class="label">Accuracy Rate</span>
                <span id="win-rate" class="value" style="color: #3fb950;">100%</span>
            </div>
            <div class="stat-row">
                <span class="label">Total Evaluated</span>
                <span id="total-trades" class="value">0</span>
            </div>
            <div class="stat-row">
                <span class="label">RSI (14) Filter</span>
                <span id="rsi" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">MACD Crossover</span>
                <span id="macd" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">Moving Average</span>
                <span id="ma" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">System Confidence</span>
                <span id="confidence" class="value">--</span>
            </div>

            <div id="mtg-alert" class="martingale-box">System Initialized. Awaiting Data...</div>
        </div>

        <div class="chart-card">
            <div id="tv-chart-container" style="height: 100%; width: 100%;"></div>
        </div>
    </div>
</body>
</html>
