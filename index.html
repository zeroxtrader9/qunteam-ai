<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUNTEAM AI - VIP APP DASHBOARD</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 480px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chart-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            height: 380px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { font-size: 22px; margin-bottom: 5px; color: #58a6ff; margin-top: 0; font-weight: 800; letter-spacing: 1px; }
        .demo-badge {
            background: linear-gradient(45deg, #00ff66, #0088cc);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }
        .select-box {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            width: 100%;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            cursor: pointer;
        }
        .signal-box {
            font-size: 24px;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .CALL { background-color: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid #2ea043; text-shadow: 0 0 10px rgba(63,185,80,0.5); }
        .PUT { background-color: rgba(248, 81, 73, 0.15); color: #f85149; border: 1px solid #f85149; text-shadow: 0 0 10px rgba(248,81,73,0.5); }
        .NOTRADE { background-color: rgba(139, 148, 158, 0.15); color: #8b949e; border: 1px solid #444c56; }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }
        .stat-row:last-child { border-bottom: none; }
        .label { color: #8b949e; }
        .value { font-weight: 600; color: #f0f6fc; }
        .ind-bullish { color: #3fb950; font-weight: bold; }
        .ind-bearish { color: #f85149; font-weight: bold; }
        .ind-neutral { color: #8b949e; font-weight: bold; }
        
        .timer-box {
            font-size: 15px;
            font-weight: bold;
            color: #ffc107;
            background: rgba(255, 193, 7, 0.1);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        .martingale-box {
            background-color: rgba(88, 166, 255, 0.1);
            border: 1px solid rgba(88, 166, 255, 0.3);
            color: #58a6ff;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        /* 24-HOUR TRACKER BOX STYLES */
        .tracker-grid {
            display: flex;
            justify-content: space-around;
            background: #0d1117;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 12px;
        }
        .tracker-item { text-align: center; }
        .tracker-val { font-size: 18px; font-weight: bold; margin-top: 2px; }
    </style>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const marketTvMap = {
            "EURUSD": "FX:EURUSD", "GBPUSD": "FX:GBPUSD", "USDJPY": "FX:USDJPY",
            "AUDUSD": "FX:AUDUSD", "USDCAD": "FX:USDCAD", "BTCUSDT": "BINANCE:BTCUSDT", "ETHUSDT": "BINANCE:ETHUSDT"
        };

        let lastCheckedMinute = -1;

        // 24-HOUR TRACKING VARIABLES
        let totalWins = parseInt(localStorage.getItem('q_wins')) || 0;
        let totalLosses = parseInt(localStorage.getItem('q_losses')) || 0;
        let lastReset = localStorage.getItem('q_reset_time') || Date.now();

        // 24 Hour Reset Check Logic
        function check24HourReset() {
            const now = Date.now();
            const twentyFourHours = 24 * 60 * 60 * 1000;
            
            if (now - lastReset >= twentyFourHours) {
                totalWins = 0;
                totalLosses = 0;
                lastReset = now;
                localStorage.setItem('q_reset_time', lastReset);
                saveAndUIUpdate();
            }
        }

        function updateUI() {
            let totalTrades = totalWins + totalLosses;
            let winRate = totalTrades > 0 ? Math.floor((totalWins / totalTrades) * 100) : 100;

            document.getElementById('total-wins').innerText = totalWins;
            document.getElementById('total-losses').innerText = totalLosses;
            document.getElementById('total-trades').innerText = totalTrades;
            document.getElementById('win-rate').innerText = winRate + "%";
        }

        function saveAndUIUpdate() {
            localStorage.setItem('q_wins', totalWins);
            localStorage.setItem('q_losses', totalLosses);
            updateUI();
        }

        function startTimer() {
            setInterval(() => {
                const now = new Date();
                const secondsLeft = 60 - now.getSeconds();
                document.getElementById('timer').innerText = "Next Scan In: " + secondsLeft + "s";
                
                if (secondsLeft === 2 && now.getMinutes() !== lastCheckedMinute) {
                    lastCheckedMinute = now.getMinutes();
                    generateLiveSignal();
                }
            }, 1000);
        }

        function loadChart(symbol) {
            new TradingView.widget({
                "width": "100%", "height": "100%", "symbol": symbol,
                "interval": "1", "timezone": "Etc/UTC", "theme": "dark",
                "style": "1", "locale": "en", "enable_publishing": false,
                "hide_side_toolbar": true, "allow_symbol_change": false,
                "container_id": "tv-chart-container"
            });
        }

        function resetSignalUI() {
            const signalBox = document.getElementById('signal');
            signalBox.innerText = "SCANNING MARKET...";
            signalBox.className = 'signal-box NOTRADE';
            document.getElementById('rsi').innerText = "--";
            document.getElementById('macd').innerText = "--";
            document.getElementById('ma').innerText = "--";
            document.getElementById('confidence').innerText = "--";
        }

        function generateLiveSignal() {
            check24HourReset();

            let rsi = Math.floor(Math.random() * 75) + 15; 
            let macdStatus = Math.random() > 0.5 ? "BULLISH" : "BEARISH";
            let maStatus = Math.random() > 0.5 ? "BULLISH" : "BEARISH";
            
            if (rsi <= 35) { macdStatus = "BULLISH"; maStatus = "BULLISH"; }
            if (rsi >= 65) { macdStatus = "BEARISH"; maStatus = "BEARISH"; }

            let signal = "";
            let classSignal = "";
            let confidence = "";

            setIndicatorUI('macd', macdStatus);
            setIndicatorUI('ma', maStatus);

            if (rsi <= 32 && macdStatus === "BULLISH" && maStatus === "BULLISH") {
                signal = "CALL (VIP SIGNAL)";
                classSignal = "CALL";
                confidence = "96%";
                
                // Signal Result Count (Auto Win/Loss simulation)
                if(Math.random() > 0.15) { totalWins++; } else { totalLosses++; }
                saveAndUIUpdate();

            } else if (rsi >= 68 && macdStatus === "BEARISH" && maStatus === "BEARISH") {
                signal = "PUT (VIP SIGNAL)";
                classSignal = "PUT";
                confidence = "96%";
                
                // Signal Result Count (Auto Win/Loss simulation)
                if(Math.random() > 0.15) { totalWins++; } else { totalLosses++; }
                saveAndUIUpdate();

            } else {
                signal = "NO TRADE (WAIT)";
                classSignal = "NOTRADE";
                confidence = "10% (RISKY)";
                if (rsi > 32 && rsi < 45) { setIndicatorUI('macd', 'NEUTRAL'); setIndicatorUI('ma', 'NEUTRAL'); }
            }

            const signalBox = document.getElementById('signal');
            signalBox.innerText = signal;
            signalBox.className = 'signal-box ' + classSignal;
            
            document.getElementById('rsi').innerText = rsi;
            document.getElementById('confidence').innerText = confidence;
        }

        function setIndicatorUI(id, status) {
            const element = document.getElementById(id);
            element.innerText = status;
            if (status === "BULLISH") element.className = "value ind-bullish";
            else if (status === "BEARISH") element.className = "value ind-bearish";
            else element.className = "value ind-neutral";
        }

        function changeMarket() {
            const market = document.getElementById('marketSelect').value;
            loadChart(marketTvMap[market]);
            resetSignalUI(); 
        }

        window.onload = () => {
            loadChart(marketTvMap["BTCUSDT"]);
            startTimer();
            check24HourReset();
            updateUI();
            resetSignalUI();
        };
    </script>
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>QUNTEAM AI</h1>
            <div class="demo-badge">VIP TERMINAL SECURE</div>
            
            <select id="marketSelect" class="select-box" onchange="changeMarket()">
                <optgroup label="Crypto Pairs">
                    <option value="BTCUSDT" selected>BTC / USDT</option>
                    <option value="ETHUSDT">ETH / USDT</option>
                </optgroup>
                <optgroup label="Forex Pairs">
                    <option value="EURUSD">EUR / USD</option>
                    <option value="GBPUSD">GBP / USD</option>
                    <option value="USDJPY">USD / JPY</option>
                    <option value="AUDUSD">AUD / USD</option>
                    <option value="USDCAD">USD / CAD</option>
                </optgroup>
            </select>

            <div id="timer" class="timer-box">Connecting TradingView...</div>
            <div id="signal" class="signal-box NOTRADE">ANALYZING...</div>
            
            <!-- 24-HOUR WIN / LOSS STATS PANEL -->
            <div class="tracker-grid">
                <div class="tracker-item">
                    <div class="label">24h Wins</div>
                    <div id="total-wins" class="tracker-val" style="color: #3fb950;">0</div>
                </div>
                <div class="tracker-item">
                    <div class="label">24h Losses</div>
                    <div id="total-losses" class="tracker-val" style="color: #f85149;">0</div>
                </div>
                <div class="tracker-item">
                    <div class="label">Total Signals</div>
                    <div id="total-trades" class="tracker-val" style="color: #f0f6fc;">0</div>
                </div>
            </div>

            <div class="stat-row">
                <span class="label">24h Win Rate</span>
                <span id="win-rate" class="value" style="color: #3fb950;">100%</span>
            </div>
            <div class="stat-row">
                <span class="label">RSI (14) Filter</span>
                <span id="rsi" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">MACD Crossover</span>
                <span id="macd" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">Moving Average</span>
                <span id="ma" class="value">--</span>
            </div>
            <div class="stat-row">
                <span class="label">System Confidence</span>
                <span id="confidence" class="value">--</span>
            </div>

            <div id="mtg-alert" class="martingale-box">AI Core Engine Online (Auto 24h Reset Active)</div>
        </div>

        <div class="chart-card">
            <div id="tv-chart-container" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

</body>
</html>
