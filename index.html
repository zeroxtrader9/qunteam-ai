<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qunteam AI - VIP Prediction Terminal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .header-card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(135deg, #141e30, #243b55);
            border: 1px solid #00f2fe;
            border-radius: 15px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
            margin-bottom: 15px;
        }

        .header-card h1 {
            font-size: 20px;
            color: #00f2fe;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-card p {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 5px;
        }

        /* TRACKER DASHBOARD */
        .tracker-card {
            width: 100%;
            max-width: 420px;
            background: #111625;
            border: 1px solid #1e293b;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .tracker-title {
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .stat-box {
            flex: 1;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: bold;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 800;
            margin-top: 4px;
        }

        .val-total { color: #f8fafc; }
        .val-win { color: #22c55e; }
        .val-loss { color: #ef4444; }

        .accuracy-box {
            margin-top: 12px;
            text-align: center;
            padding: 8px;
            background: rgba(234, 179, 8, 0.1);
            border: 1px dashed #eab308;
            border-radius: 8px;
        }

        .accuracy-text {
            font-size: 14px;
            font-weight: 700;
            color: #eab308;
        }

        /* PREDICTION AREA */
        .prediction-card {
            width: 100%;
            max-width: 420px;
            background: #111625;
            border: 1px solid #1e293b;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .signal-display {
            background: #0b0e14;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 25px 15px;
            margin: 15px 0;
        }

        .signal-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00f2fe;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-main:active {
            transform: scale(0.98);
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-win {
            flex: 1;
            padding: 12px;
            background: #22c55e;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-loss {
            flex: 1;
            padding: 12px;
            background: #ef4444;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        .footer-note {
            font-size: 10px;
            color: #475569;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- TOP TITLE HEADER -->
    <div class="header-card">
        <h1>Qunteam AI VIP Terminal</h1>
        <p>Live Signal Generator & Auto-Tracker</p>
    </div>

    <!-- 24H PERFORMANCE TRACKER DASHBOARD -->
    <div class="tracker-card">
        <div class="tracker-title">📊 24-Hour Performance Stats</div>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Total</div>
                <div class="stat-value val-total" id="total-count">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Wins</div>
                <div class="stat-value val-win" id="win-count">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Losses</div>
                <div class="stat-value val-loss" id="loss-count">0</div>
            </div>
        </div>
        <div class="accuracy-box">
            <span class="accuracy-text">Accuracy: <span id="accuracy-rate">0%</span></span>
        </div>
    </div>

    <!-- PREDICTION & SIGNAL PANEL -->
    <div class="prediction-card">
        <button class="btn-main" onclick="getSignal()">GET NEXT SIGNAL</button>
        
        <div class="signal-display">
            <div class="signal-text" id="signal-box">READY</div>
        </div>

        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Mark Signal Result:</p>
        <div class="action-btns">
            <button class="btn-win" onclick="recordWin()">WIN ✓</button>
            <button class="btn-loss" onclick="recordLoss()">LOSS ✗</button>
        </div>
    </div>

    <div class="footer-note">
        Stats automatically reset every 24 hours.
    </div>

    <!-- JAVASCRIPT LOGIC ENGINE -->
    <script>
        // Load stored data or default to 0
        let wins = parseInt(localStorage.getItem('qunteam_wins')) || 0;
        let losses = parseInt(localStorage.getItem('qunteam_losses')) || 0;
        let lastReset = localStorage.getItem('qunteam_reset_time') || Date.now();

        // 24 Hour Reset Logic Check
        function check24HourReset() {
            const now = Date.now();
            const twentyFourHours = 24 * 60 * 60 * 1000;
            
            if (now - lastReset >= twentyFourHours) {
                wins = 0;
                losses = 0;
                lastReset = now;
                localStorage.setItem('qunteam_reset_time', lastReset);
                saveAndUIUpdate();
            }
        }

        // Update Screen UI & Accuracy Calculation
        function updateUI() {
            const total = wins + losses;
            const accuracy = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;

            document.getElementById('win-count').innerText = wins;
            document.getElementById('loss-count').innerText = losses;
            document.getElementById('total-count').innerText = total;
            document.getElementById('accuracy-rate').innerText = accuracy + '%';
        }

        function saveAndUIUpdate() {
            localStorage.setItem('qunteam_wins', wins);
            localStorage.setItem('qunteam_losses', losses);
            updateUI();
        }

        // Record Win
        function recordWin() {
            check24HourReset();
            wins++;
            saveAndUIUpdate();
            document.getElementById('signal-box').innerText = "WIN ADDED ✓";
            document.getElementById('signal-box').style.color = "#22c55e";
        }

        // Record Loss
        function recordLoss() {
            check24HourReset();
            losses++;
            saveAndUIUpdate();
            document.getElementById('signal-box').innerText = "LOSS ADDED ✗";
            document.getElementById('signal-box').style.color = "#ef4444";
        }

        // Signal Generator
        function getSignal() {
            check24HourReset();
            const signals = ["CALL / UP ⬆️", "PUT / DOWN ⬇️", "DRAGON 🐉", "TIGER 🐯"];
            const randomSignal = signals[Math.floor(Math.random() * signals.length)];
            
            const signalBox = document.getElementById('signal-box');
            signalBox.innerText = randomSignal;
            signalBox.style.color = "#00f2fe";
        }

        // Run automatically on page load
        check24HourReset();
        updateUI();
    </script>
</body>
</html>
