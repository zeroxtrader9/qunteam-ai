<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUNTEAM AI - DOM CONTROL PANEL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { color: #58a6ff; margin-bottom: 15px; font-size: 20px; }
        
        .signal-display {
            font-size: 22px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #21262d;
            border: 1px solid #30363d;
        }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-call { background: #2ea043; color: white; }
        .btn-put { background: #da3633; color: white; }
        .btn-green { background: #3fb950; color: black; }
        .btn-red { background: #f85149; color: white; }

        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #0d1117;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-top: 15px;
        }
        .stat-item { text-align: center; }
        .stat-val { font-size: 18px; font-weight: bold; margin-top: 4px; }
        
        .status-msg {
            margin-top: 12px;
            font-size: 13px;
            color: #8b949e;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>QUNTEAM AI SYSTEM</h2>

        <!-- DOM SIGNAL DISPLAY -->
        <div id="signalDisplay" class="signal-display">NO SIGNAL</div>

        <!-- SIGNAL CONTROLS -->
        <p style="font-size: 12px; color: #8b949e; margin-bottom: 6px;">1. Select Signal:</p>
        <div class="btn-group">
            <button class="btn-call" onclick="setSignal('CALL')">CALL (UP)</button>
            <button class="btn-put" onclick="setSignal('PUT')">PUT (DOWN)</button>
        </div>

        <!-- CANDLE RESULT CONTROLS -->
        <p style="font-size: 12px; color: #8b949e; margin-bottom: 6px;">2. Select Candle Result:</p>
        <div class="btn-group">
            <button class="btn-green" onclick="evaluateCandle('GREEN')">GREEN Candle</button>
            <button class="btn-red" onclick="evaluateCandle('RED')">RED Candle</button>
        </div>

        <!-- STATS DISPLAY -->
        <div class="stats-box">
            <div class="stat-item">
                <div style="font-size: 11px; color: #8b949e;">Today Wins</div>
                <div id="winCount" class="stat-val" style="color: #3fb950;">0</div>
            </div>
            <div class="stat-item">
                <div style="font-size: 11px; color: #8b949e;">Today Losses</div>
                <div id="lossCount" class="stat-val" style="color: #f85149;">0</div>
            </div>
            <div class="stat-item">
                <div style="font-size: 11px; color: #8b949e;">Win Rate</div>
                <div id="winRate" class="stat-val" style="color: #58a6ff;">100%</div>
            </div>
        </div>

        <div id="statusMessage" class="status-msg">Daily Auto-Reset Active (12:00 AM)</div>
    </div>

    <!-- DOM JAVASCRIPT LOGIC -->
    <script>
        // DOM ELEMENTS SELECTION
        const signalDisplay = document.getElementById('signalDisplay');
        const winCountEl = document.getElementById('winCount');
        const lossCountEl = document.getElementById('lossCount');
        const winRateEl = document.getElementById('winRate');
        const statusMsgEl = document.getElementById('statusMessage');

        let currentSignal = null;
        let wins = 0;
        let losses = 0;

        // --- 12:00 AM MIDNIGHT RESET LOGIC ---
        function checkMidnightReset() {
            const storedMidnight = localStorage.getItem('dom_midnight_time') || 0;
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            const currentMidnight = now.getTime();

            if (parseInt(storedMidnight) < currentMidnight) {
                wins = 0;
                losses = 0;
                localStorage.setItem('dom_midnight_time', currentMidnight);
                updateDOM();
            } else {
                wins = parseInt(localStorage.getItem('dom_wins')) || 0;
                losses = parseInt(localStorage.getItem('dom_losses')) || 0;
            }
        }

        function saveData() {
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            localStorage.setItem('dom_midnight_time', now.getTime());
            localStorage.setItem('dom_wins', wins);
            localStorage.setItem('dom_losses', losses);
            updateDOM();
        }

        function updateDOM() {
            winCountEl.innerText = wins;
            lossCountEl.innerText = losses;
            
            const total = wins + losses;
            const rate = total > 0 ? Math.floor((wins / total) * 100) : 100;
            winRateEl.innerText = rate + "%";
        }

        // --- SET SIGNAL ---
        function setSignal(type) {
            checkMidnightReset();
            currentSignal = type;
            if (type === 'CALL') {
                signalDisplay.innerText = "SIGNAL: CALL (GREEN)";
                signalDisplay.style.color = "#3fb950";
                signalDisplay.style.borderColor = "#2ea043";
            } else if (type === 'PUT') {
                signalDisplay.innerText = "SIGNAL: PUT (RED)";
                signalDisplay.style.color = "#f85149";
                signalDisplay.style.borderColor = "#da3633";
            }
            statusMsgEl.innerText = "Signal active. Now select candle result.";
            statusMsgEl.style.color = "#ffc107";
        }

        // --- EVALUATE CANDLE vs SIGNAL LOGIC ---
        function evaluateCandle(candleColor) {
            checkMidnightReset();

            if (!currentSignal) {
                statusMsgEl.innerText = "Please select a Signal (CALL/PUT) first!";
                statusMsgEl.style.color = "#f85149";
                return;
            }

            // EXACT RULE EVALUATION
            if (currentSignal === 'CALL') {
                if (candleColor === 'GREEN') {
                    wins++; // CALL + GREEN = WIN
                    statusMsgEl.innerText = "RESULT: WIN ✓ (CALL + Green)";
                    statusMsgEl.style.color = "#3fb950";
                } else {
                    losses++; // CALL + RED = LOSS
                    statusMsgEl.innerText = "RESULT: LOSS ✗ (CALL + Red)";
                    statusMsgEl.style.color = "#f85149";
                }
            } else if (currentSignal === 'PUT') {
                if (candleColor === 'RED') {
                    wins++; // PUT + RED = WIN
                    statusMsgEl.innerText = "RESULT: WIN ✓ (PUT + Red)";
                    statusMsgEl.style.color = "#3fb950";
                } else {
                    losses++; // PUT + GREEN = LOSS
                    statusMsgEl.innerText = "RESULT: LOSS ✗ (PUT + Green)";
                    statusMsgEl.style.color = "#f85149";
                }
            }

            currentSignal = null; // Reset signal
            signalDisplay.innerText = "WAITING FOR NEXT SIGNAL";
            signalDisplay.style.color = "#c9d1d9";
            signalDisplay.style.borderColor = "#30363d";

            saveData();
        }

        // INITIAL LOAD
        window.onload = () => {
            checkMidnightReset();
            updateDOM();
        };
    </script>
</body>
</html>
